# Test gate for main. Job names (backend, frontend) are the status checks that
# branch protection requires, so renaming a job breaks the rule silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26; on Node 20 undici
          # blows up with "markAsUncloneable is not a function" before any test
          # runs. Keep this in step with frontend/package.json engines.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Build first: a type error surfaces here with a clearer message than a
      # test failure downstream would give.
      - run: npm run build
      - run: npm test
