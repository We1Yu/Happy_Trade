services:
  # Started but not yet wired to the backend. It is present so the running stack
  # matches ADR-0001 and the AI-signal slice can adopt it without re-provisioning.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: happytrade
      POSTGRES_PASSWORD: happytrade
      POSTGRES_DB: happytrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happytrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      HAPPYTRADE_BINANCE_BASE_URL: https://api.binance.com

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend

volumes:
  pgdata:
